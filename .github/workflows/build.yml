name: NyroxPC Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Compile UEFI bootloader
        run: |
          set -e
          mkdir -p build/bootloader
          for src in bootloader/src/*.c; do
            obj="build/bootloader/$(basename "${src%.c}").obj"
            clang --target=x86_64-pc-win32-coff \
              -std=c11 -O2 -ffreestanding -fshort-wchar \
              -mno-red-zone -fno-stack-protector -fno-builtin \
              -Iinclude -c "$src" -o "$obj"
          done

      - name: Compile kernel
        run: |
          set -e
          mkdir -p build/kernel
          for src in kernel/src/*.c kernel/arch/x86_64/*.c; do
            obj="build/kernel/$(basename "${src%.c}").obj"
            clang --target=x86_64-unknown-none-elf \
              -std=c11 -O2 -ffreestanding -fno-stack-protector \
              -fno-pic -mno-red-zone -Wall -Wextra -Werror \
              -Iinclude -Ikernel/src -Ikernel/arch/x86_64 \
              -c "$src" -o "$obj"
          done
          clang --target=x86_64-unknown-none-elf \
            -c kernel/arch/x86_64/gdt.S -o build/kernel/gdt-asm.obj
          clang --target=x86_64-unknown-none-elf \
            -c kernel/arch/x86_64/interrupts.S -o build/kernel/interrupts-asm.obj

      - name: Link kernel ELF
        run: |
          ld.lld -T kernel/linker.ld -nostdlib -static \
            -o build/KERNEL.ELF build/kernel/*.obj

      - name: Link UEFI application
        run: |
          lld-link /subsystem:efi_application /entry:efi_main \
            /nodefaultlib /machine:x64 \
            /out:build/BOOTX64.EFI build/bootloader/*.obj

      - name: Verify outputs
        run: |
          file build/BOOTX64.EFI build/KERNEL.ELF
          llvm-readelf -h build/KERNEL.ELF
          llvm-readelf -lW build/KERNEL.ELF

      - uses: actions/upload-artifact@v4
        with:
          name: NyroxPC-x86_64
          path: |
            build/BOOTX64.EFI
            build/KERNEL.ELF
